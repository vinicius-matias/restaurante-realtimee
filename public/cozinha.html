<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha - Painel de Pedidos</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(rgba(10, 15, 29, 0.85), rgba(10, 15, 29, 0.85)), url('https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #f1f5f9; 
      padding: 24px; 
      min-height: 100vh; 
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); flex-wrap: wrap; gap: 16px; }
    h2 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #ffffff; }
    
    .nav-tabs { display: flex; gap: 10px; }
    .tab-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #94a3b8; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 0.9rem; }
    .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }

    .grid-pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card-pedido { 
      background: rgba(15, 23, 42, 0.88); 
      backdrop-filter: blur(12px);
      border-radius: 14px; 
      padding: 22px; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 6px solid #f59e0b; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }
    .card-pedido.preparo { border-left-color: #0284c7; }
    .card-pedido.concluido-card { border-left-color: #16a34a; }
    .card-pedido.atrasado { border-left-color: #ef4444 !important; background: rgba(45, 15, 20, 0.9); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .mesa-badge { background: rgba(2, 132, 199, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); font-weight: 700; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; }
    .garcom-badge { background: rgba(255, 255, 255, 0.1); color: #f8fafc; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .timer-badge { font-size: 0.85rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.1); color: #e2e8f0; }

    .itens { font-size: 1.05rem; line-height: 1.6; color: #e2e8f0; white-space: pre-line; margin: 12px 0; flex-grow: 1; }
    .obs-box { background: rgba(245, 158, 11, 0.15); border-left: 3px solid #f59e0b; color: #fef08a; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; }

    .btn-acao { border: none; padding: 12px; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; width: 100%; margin-top: 6px; }
    .btn-preparo { background-color: #0284c7; color: white; }
    .btn-concluir { background-color: #16a34a; color: white; }
    .sem-pedidos { color: #94a3b8; font-size: 1.1rem; grid-column: 1 / -1; text-align: center; padding: 50px 20px; background: rgba(15, 23, 42, 0.6); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 12px; }
    
    #abaConcluidos { display: none; }
  </style>
</head>
<body>
  <header>
    <h2>Painel da Cozinha</h2>
    <div class="nav-tabs">
      <button id="btnTabAtivos" class="tab-btn active" onclick="mudarAba('ativos')">🔥 Em Aberto</button>
      <button id="btnTabConcluidos" class="tab-btn" onclick="mudarAba('concluidos')">✅ Concluídos</button>
    </div>
  </header>

  <div id="abaAtivos" class="grid-pedidos">
    <div id="msgVazia" class="sem-pedidos">Nenhum pedido pendente no momento.</div>
  </div>

  <div id="abaConcluidos" class="grid-pedidos">
    <div id="msgVaziaConcluidos" class="sem-pedidos">Nenhum pedido concluído ainda.</div>
  </div>

  <script>
    const socket = io();
    const abaAtivos = document.getElementById('abaAtivos');
    const abaConcluidos = document.getElementById('abaConcluidos');
    const msgVazia = document.getElementById('msgVazia');
    const msgVaziaConcluidos = document.getElementById('msgVaziaConcluidos');
    let audioCtx = null;

    function inicializarAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('click', inicializarAudio, { once: true });

    function tocarSomEntrada() {
      inicializarAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } catch(e){}
    }

    function mudarAba(aba) {
      if (aba === 'ativos') {
        abaAtivos.style.display = 'grid'; abaConcluidos.style.display = 'none';
        document.getElementById('btnTabAtivos').classList.add('active');
        document.getElementById('btnTabConcluidos').classList.remove('active');
      } else {
        abaAtivos.style.display = 'none'; abaConcluidos.style.display = 'grid';
        document.getElementById('btnTabAtivos').classList.remove('active');
        document.getElementById('btnTabConcluidos').classList.add('active');
      }
    }

    function atualizarCronometros() {
      const agora = Date.now();
      document.querySelectorAll('#abaAtivos .card-pedido').forEach(card => {
        const ts = Number(card.dataset.timestamp);
        const diffSegundos = Math.floor((agora - ts) / 1000);
        const minutos = Math.floor(diffSegundos / 60);
        const segundos = diffSegundos % 60;

        const timerElement = card.querySelector('.timer-badge');
        if (timerElement) {
          timerElement.innerText = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;
        }
        if (minutos >= 15) {
          card.classList.add('atrasado');
          if (timerElement) timerElement.innerText = `⚠️ ${minutos}m (ATRASADO)`;
        }
      });
    }
    setInterval(atualizarCronometros, 1000);

    function renderizarTelas(pedidos) {
      abaAtivos.querySelectorAll('.card-pedido').forEach(el => el.remove());
      abaConcluidos.querySelectorAll('.card-pedido').forEach(el => el.remove());

      const ativos = pedidos.filter(p => p.status === 'aberto' || p.status === 'preparo');
      const concluidos = pedidos.filter(p => p.status === 'concluido');

      msgVazia.style.display = ativos.length === 0 ? 'block' : 'none';
      msgVaziaConcluidos.style.display = concluidos.length === 0 ? 'block' : 'none';

      // Renderizar Ativos
      ativos.forEach(p => {
        const card = document.createElement('div');
        card.className = `card-pedido ${p.status === 'preparo' ? 'preparo' : ''}`;
        card.dataset.timestamp = p.timestamp;
        
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="mesa-badge">Mesa ${p.mesa}</span>
              <span class="garcom-badge">👤 ${p.garcom || 'Garçom'}</span>
              <span class="timer-badge">00:00</span>
            </div>
            <div class="itens">${p.itens}</div>
            ${p.observacao ? `<div class="obs-box">⚠️ Obs: ${p.observacao}</div>` : ''}
          </div>
          <div>
            ${p.status === 'aberto' 
              ? `<button class="btn-acao btn-preparo" onclick="iniciarPreparo(${p.id})">👨‍🍳 Iniciar Preparo</button>`
              : `<button class="btn-acao btn-concluir" onclick="concluirPedido(${p.id})">✅ Marcar como Pronto</button>`
            }
          </div>
        `;
        abaAtivos.prepend(card);
      });

      // Renderizar Concluídos
      concluidos.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card-pedido concluido-card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="mesa-badge">Mesa ${p.mesa}</span>
              <span class="garcom-badge">👤 ${p.garcom || 'Garçom'}</span>
            </div>
            <div class="itens">${p.itens}</div>
            ${p.observacao ? `<div class="obs-box">⚠️ Obs: ${p.observacao}</div>` : ''}
          </div>
          <div style="color:#4ade80; font-weight:700; text-align:center; padding:8px; background:rgba(74,222,128,0.1); border-radius:6px; font-size:0.85rem;">
            ✓ ENTREGUE (Finalizado às ${p.horarioConclusao || p.horario})
          </div>
        `;
        abaConcluidos.appendChild(card);
      });

      atualizarCronometros();
    }

    function iniciarPreparo(id) { socket.emit('iniciar_preparo', id); }
    function concluirPedido(id) { socket.emit('concluir_pedido', id); }

    socket.on('pedidos_atualizados', renderizarTelas);
    socket.on('novo_pedido_cozinha', () => tocarSomEntrada());
  </script>
</body>
</html>
